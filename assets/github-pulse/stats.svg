<svg xmlns="http://www.w3.org/2000/svg" width="415" height="230" viewBox="0 0 415 230" role="img" aria-labelledby="title desc"><title id="title">Repository activity</title><desc id="desc">Authored commits in the past 365 days on owned, non-fork default branches; includes private work; duplicate commit IDs count once.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif;fill:#c9d1d9;font-size:14px}.title{fill:#58a6ff;font-size:22px;font-weight:600}.muted{fill:#8b949e;font-size:11px}.value{fill:#f0f6fc;font-weight:600}</style><rect x=".5" y=".5" width="414" height="229" rx="7" fill="#0d1117" stroke="#30363d"/><text x="26" y="39" class="title">Repository activity</text><text x="26" y="79">Unique commits · past year</text><text x="385" y="79" text-anchor="end" class="value">3,486</text><text x="26" y="110">In public repositories</text><text x="385" y="110" text-anchor="end" class="value">84</text><text x="26" y="141">In private repositories only</text><text x="385" y="141" text-anchor="end" class="value">3,402</text><text x="26" y="172">Public repositories</text><text x="385" y="172" text-anchor="end" class="value">20</text><text x="26" y="203">Stars on public repositories</text><text x="385" y="203" text-anchor="end" class="value">10</text></svg>
